<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fontsource-playfair-display-5.3.0/package/400-italic.css">
<link rel="stylesheet" href="fonts/fontsource-playfair-display-5.3.0/package/700.css">
<link rel="stylesheet" href="fonts/fontsource-playfair-display-5.3.0/package/700-italic.css">
<link rel="stylesheet" href="fonts/fontsource-playfair-display-5.3.0/package/900.css">
<link rel="stylesheet" href="fonts/fontsource-cormorant-garamond-5.3.0/package/500-italic.css">
<link rel="stylesheet" href="fonts/fontsource-cormorant-garamond-5.3.0/package/600-italic.css">
<link rel="stylesheet" href="fonts/fontsource-cormorant-garamond-5.3.0/package/700.css">
<link rel="stylesheet" href="fonts/fontsource-unbounded-5.3.0/package/800.css">
<link rel="stylesheet" href="fonts/fontsource-unbounded-5.3.0/package/900.css">
<link rel="stylesheet" href="fonts/fontsource-montserrat-5.3.0/package/800.css">
<link rel="stylesheet" href="fonts/fontsource-montserrat-5.3.0/package/900.css">
<link rel="stylesheet" href="fonts/fontsource-oswald-5.3.0/package/600.css">
<link rel="stylesheet" href="fonts/fontsource-oswald-5.3.0/package/700.css">
<style>
  /* Обложка Reels 1080×1920. Ключевой текст — в зоне y 260–1500 (видна и в сетке профиля 3:4). */
  :root { --acc: #d8bc8e; --coral: #e4826f; --ink: #fff; --soft: rgba(255,255,255,.82); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; }
  img.full { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .t { position: absolute; color: var(--ink); line-height: 1; white-space: nowrap;
       text-shadow: 0 6px 30px rgba(8, 10, 24, .45); }
  .acc { color: var(--acc); }
  .coral { color: var(--coral); }
  .inter { font-family: "Inter Display", "Inter", sans-serif; }
  .play { font-family: "Playfair Display", serif; font-feature-settings: "lnum" 1; }
  .corm { font-family: "Cormorant Garamond", serif; }
  .unb { font-family: "Unbounded", sans-serif; }
  .mont { font-family: "Montserrat", sans-serif; }
  .osw { font-family: "Oswald", sans-serif; }
  .label { font: 600 30px "Inter"; letter-spacing: 9px; text-transform: uppercase; color: var(--acc);
           display: flex; align-items: center; gap: 20px; text-shadow: none; }
  .label::before { content: ""; width: 54px; height: 3px; background: var(--acc); }
  .dots { position: absolute; display: grid; grid-template-columns: repeat(10, 16px); gap: 13px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.22); display: block; }
  .dots i.m { background: var(--acc); box-shadow: 0 0 14px rgba(216,188,142,.65); }
  .frame { position: absolute; border: 2px solid rgba(216,188,142,.85); border-radius: 26px; }
  .pct { font-size: .88em; }                         /* «%» чуть меньше цифр */
  .q { font-size: 1.45em; margin-left: .03em; }      /* «?» крупнее строки */
  .mark { display: inline-block; line-height: .84; padding: .07em .1em .03em; background: var(--acc); color: #151b34;
          border-radius: .07em; text-shadow: none; }
  html.measure img.full { visibility: hidden; }
  html.measure, html.measure body { background: transparent; }
  html.measure .t { text-shadow: none; }
  .shade { position: absolute; inset: 0;
           background: radial-gradient(900px 700px at 20% 18%, rgba(10,12,28,.38), rgba(10,12,28,0) 70%); }
</style></head>
<body>
<img class="full" id="bg">
<div class="layer" id="behind"></div>
<img class="full" id="person" style="display:none">
<div class="layer" id="front"></div>
<script>
const Z = { a: "1.00", b: "1.15", c: "1.30" };
// Каждый вариант: крупность кадра, текст за фигурой (behind) и/или перед ней (front)
const V = {
  1: { z: "a", front: `
      <div class="t label" style="left:84px; top:318px">Всего</div>
      <div class="t inter" style="left:76px; top:370px; font-weight:700; font-size:222px; letter-spacing:-8px">10%<span class="acc" style="font-size:262px">?</span></div>` },
  2: { z: "c", person: true, behind: `
      <div class="t inter" style="left:0; right:0; text-align:center; top:330px; font-weight:800; font-size:420px; letter-spacing:-16px">10%<span class="acc">?</span></div>`,
      front: `<div class="t label" style="left:84px; top:272px">Всего</div>` },
  3: { z: "b", front: `
      <div class="t play" style="left:82px; top:266px; font-style:italic; font-size:96px; color:var(--soft)">Всего</div>
      <div class="t play" style="left:70px; top:342px; font-weight:700; font-size:196px; letter-spacing:-4px">10%<span class="acc" style="font-style:italic; font-size:240px">?</span></div>` },
  4: { z: "a", front: `
      <div class="t unb" style="left:80px; top:322px; font-weight:800; font-size:92px">ВСЕГО</div>
      <div class="t unb" style="left:74px; top:432px; font-weight:900; font-size:146px; letter-spacing:-4px">10%<span class="acc" style="font-size:176px">?</span></div>` },
  5: { z: "c", person: true, behind: `
      <div class="t play acc" style="left:520px; top:300px; font-weight:700; font-style:italic; font-size:980px; opacity:.94">?</div>`,
      front: `
      <div class="t inter" style="left:80px; top:276px; font-weight:600; font-size:80px; color:var(--soft)">Всего</div>
      <div class="t inter" style="left:72px; top:356px; font-weight:800; font-size:184px; letter-spacing:-7px">10%</div>` },
  6: { z: "b", front: `
      <div class="t label" style="left:84px; top:272px">Вклад медицины</div>
      <div class="t inter" style="left:78px; top:318px; font-weight:700; font-size:112px; letter-spacing:-4px">Всего</div>
      <div class="t inter" style="left:74px; top:424px; font-weight:800; font-size:140px; letter-spacing:-5px"><span class="acc">10%</span>?</div>` },
  7: { z: "b", front: `
      <div class="t osw" style="left:80px; top:262px; font-weight:600; font-size:96px; letter-spacing:6px">ВСЕГО</div>
      <div class="t osw" style="left:72px; top:350px; font-weight:700; font-size:212px; letter-spacing:2px">10%<span class="coral" style="font-size:244px">?</span></div>` },
  8: { z: "a", front: `
      <div class="frame" style="left:62px; top:284px; width:576px; height:356px"></div>
      <div class="t label" style="left:104px; top:322px">Вклад медицины</div>
      <div class="t inter" style="left:100px; top:384px; font-weight:700; font-size:112px; letter-spacing:-3px">Всего</div>
      <div class="t inter" style="left:98px; top:494px; font-weight:800; font-size:122px; letter-spacing:-4px"><span class="acc">10%</span>?</div>` },
  9: { z: "a", front: `
      <div class="t label" style="left:84px; top:272px">Всего</div>
      <div class="t inter" style="left:76px; top:316px; font-weight:800; font-size:190px; letter-spacing:-7px">10%<span class="acc">?</span></div>
      <div class="dots" style="left:86px; top:540px">${'<i></i>'.repeat(90)}${'<i class="m"></i>'.repeat(10)}</div>` },
  10: { z: "b", front: `
      <div class="t mont" style="left:78px; top:268px; font-weight:800; font-size:82px; line-height:1.08">От чего<br>зависит<br>здоровье<span class="acc" style="font-size:104px">?</span></div>` },
  11: { z: "c", front: `
      <div class="t play" style="left:76px; top:268px; font-style:italic; font-size:78px; color:var(--soft); line-height:1.05">Лучшее<br>лечение —</div>
      <div class="t play acc" style="left:72px; top:440px; font-weight:700; font-size:86px">профилактика</div>` },
  12: { z: "a", front: `
      <div class="t inter" style="left:80px; top:330px; font-weight:600; font-size:88px; color:var(--soft)">Медицина —</div>
      <div class="t inter" style="left:74px; top:432px; font-weight:800; font-size:110px; letter-spacing:-4px">всего <span class="acc">10%</span>?</div>` },
  13: { z: "b", front: `
      <div class="t unb" style="left:80px; top:270px; font-weight:800; font-size:64px; line-height:1.12">Что решает<br>остальные</div>
      <div class="t unb acc" style="left:72px; top:424px; font-weight:900; font-size:126px; letter-spacing:-4px">90%<span style="color:#fff; font-size:150px">?</span></div>` },
  14: { z: "c", person: true, behind: `
      <div class="t corm" style="left:0; right:0; text-align:center; top:352px; font-weight:700; font-size:350px; letter-spacing:-6px; font-feature-settings:'lnum' 1">10%<span class="acc" style="font-style:italic">?</span></div>`,
      front: `<div class="t corm acc" style="left:84px; top:262px; font-weight:600; font-style:italic; font-size:110px">всего</div>` },
  15: { z: "a", front: `
      <div class="t inter" style="left:80px; top:340px; font-weight:600; font-size:96px; color:var(--soft)">Для чего</div>
      <div class="t inter" style="left:74px; top:450px; font-weight:800; font-size:104px; letter-spacing:-3px">этот блог<span class="acc" style="font-size:130px">?</span></div>` },
  // «Всего 10%?!» в одну строку, кадр со скриншота заказчика (base2: 99,70 с, рот закрыт).
  // data-w — ширина строки (кегль подбирается), data-center — по центру.
  16: { z: "c", base: "base2", person: true, behind: `
      <div class="t inter" data-w="944" data-center style="top:421px; font-weight:900; font-size:170px; letter-spacing:-.035em">Всего 10%<span class="acc" style="font-size:1.1em">?!</span></div>` },
  17: { z: "b", base: "base2", front: `
      <div class="t unb" data-w="652" style="left:30px; top:285px; font-weight:900; font-size:90px; letter-spacing:-.02em">ВСЕГО 10<span class="pct">%</span><span class="acc q">?</span></div>` },
  18: { z: "b", base: "base2", person: true, behind: `
      <div class="t osw" data-w="944" data-center style="top:432px; font-weight:700; font-size:180px; letter-spacing:.01em">ВСЕГО 10%<span class="coral" style="font-size:1.06em">?!</span></div>` },
  19: { z: "a", base: "base2", front: `
      <div class="t play" data-w="580" style="left:72px; top:300px; font-weight:900; font-size:200px"><span style="font-size:.46em; font-style:italic; font-weight:400; color:var(--soft)">Всего&nbsp;</span>10%<span class="acc" style="font-style:italic; font-weight:700; font-size:1.08em">?!</span></div>` },
  20: { z: "c", base: "base2", front: `
      <div class="t mont" data-w="800" data-center style="top:398px; font-weight:900; font-size:110px; letter-spacing:-.02em">Всего <span class="mark">10%</span><span style="font-size:1.1em">?!</span></div>` },
  // № 21 — № 17 в прежнем виде (до правок по разметке), без «!», по центру; «?» и «%» здесь ещё крупнее.
  // Большой «?» опущен ниже строки: под ним стена (голова — под серединой строки), а сверху — картина.
  21: { z: "b", base: "base2", front: `
      <div class="t unb" data-center style="top:423px; font-weight:900; font-size:96px; letter-spacing:-.02em">ВСЕГО 10<span class="pct" style="font-size:.96em">%</span><span class="acc q" style="font-size:1.86em; vertical-align:-.155em">?</span></div>` },
  // № 22, 23 — № 17 и № 21 на кадре со скриншота заказчика (base3: руки сложены, ник убран);
  // голова здесь на 7 px выше, поэтому строка № 23 чуть меньше — зазоры до картины и макушки равны.
  22: { z: "b", base: "base3", front: `
      <div class="t unb" data-w="652" style="left:30px; top:285px; font-weight:900; font-size:90px; letter-spacing:-.02em">ВСЕГО 10<span class="pct">%</span><span class="acc q">?</span></div>` },
  23: { z: "b", base: "base3", front: `
      <div class="t unb" data-center style="top:425px; font-weight:900; font-size:97px; letter-spacing:-.02em">ВСЕГО 10<span class="pct">%</span><span class="acc q">?</span></div>` },
};
window.setVariant = async (n) => {
  const v = V[n];
  const dir = v.base || "base";                       // base — кадр 99,80 с (№ 1–15)
  document.getElementById("bg").src = `${dir}/frame_1080_z${Z[v.z]}.png`;
  const p = document.getElementById("person");
  p.style.display = v.person ? "block" : "none";
  if (v.person) p.src = `${dir}/person_z${Z[v.z]}.png`;
  document.getElementById("behind").innerHTML = v.behind || "";
  document.getElementById("front").innerHTML = (v.shade ? '<div class="shade"></div>' : "") + (v.front || "");
  await Promise.all([...document.images].filter(i => i.style.display !== "none")
    .map(i => i.complete && i.naturalWidth ? null : new Promise(r => { i.onload = r; i.onerror = r; })));
  document.body.offsetWidth;
  await document.fonts.ready;
  fit(); fit();
};
// Кегль строки — под заданную ширину; при data-center строка ставится по центру кадра.
function fit() {
  document.querySelectorAll("[data-w], [data-center]").forEach(el => {
    el.style.width = "max-content";
    if (el.dataset.w) {
      const w = el.getBoundingClientRect().width;
      el.style.fontSize = parseFloat(getComputedStyle(el).fontSize) * (+el.dataset.w) / w + "px";
    }
    if ("center" in el.dataset) el.style.left = (1080 - el.getBoundingClientRect().width) / 2 + "px";
  });
}
// Замер: только текст выбранного слоя на прозрачном фоне, без тени.
window.measure = (layer) => {
  document.documentElement.classList.add("measure");
  for (const id of ["behind", "front"]) document.getElementById(id).style.visibility = id === layer ? "visible" : "hidden";
};
window.unmeasure = () => {
  document.documentElement.classList.remove("measure");
  for (const id of ["behind", "front"]) document.getElementById(id).style.visibility = "visible";
};
window.VARIANTS = Object.keys(V).map(Number);
</script>
</body></html>
