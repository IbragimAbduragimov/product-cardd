<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Montserrat", "Segoe UI", "Inter", "DejaVu Sans", Arial, sans-serif;
      }
      #source {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #title {
        position: absolute;
        top: 220px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #fff;
        font-size: 96px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      }
      #insert {
        position: absolute;
        top: 520px;
        left: 140px;
        width: 800px;
        height: 260px;
        border-radius: 32px;
        background: #ffd400;
        color: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        font-weight: 800;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
      #captions {
        position: absolute;
        left: 0;
        bottom: 620px;
        width: 100%;
        height: 260px;
        overflow: visible;
      }
      .cg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        align-content: center;
        gap: 12px 18px;
        padding: 0 90px;
        opacity: 0;
        visibility: hidden;
      }
      .w {
        display: inline-block;
        padding: 8px 18px;
        border-radius: 16px;
        color: #fff;
        font-size: 72px;
        font-weight: 900;
        text-transform: uppercase;
        -webkit-text-stroke: 3px #000;
        paint-order: stroke fill;
      }
      .w.on {
        background: #ff2d55;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="source"
        class="clip"
        src="assets/source.mp4"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <h1 id="title" class="clip" data-start="0" data-duration="2.6" data-track-index="1">SHORTS STUDIO</h1>
      <div id="insert" class="clip" data-start="2.6" data-duration="2.4" data-track-index="2">Вставка ✓</div>
      <div id="flash" class="clip" data-start="2.4" data-duration="0.5" data-track-index="3"></div>
      <div id="captions" class="clip" data-start="0" data-duration="6" data-track-index="4"></div>
    </div>
    <script>
      // Тестовые тайминги слов (вручную, в формате `hyperframes transcribe`).
      var WORDS = [
        { id: "w0", text: "Привет!", start: 0.4, end: 0.9 },
        { id: "w1", text: "Это", start: 1.0, end: 1.2 },
        { id: "w2", text: "тест", start: 1.25, end: 1.6 },
        { id: "w3", text: "монтажа", start: 1.65, end: 2.2 },
        { id: "w4", text: "в", start: 2.5, end: 2.6 },
        { id: "w5", text: "HyperFrames", start: 2.65, end: 3.3 },
        { id: "w6", text: "с", start: 3.6, end: 3.7 },
        { id: "w7", text: "русскими", start: 3.75, end: 4.2 },
        { id: "w8", text: "субтитрами", start: 4.25, end: 5.0 },
      ];

      // Группы по 2-3 слова, разрыв на паузах от 150 мс.
      var GROUPS = [];
      var cur = null;
      WORDS.forEach(function (w, i) {
        var prev = WORDS[i - 1];
        if (!cur || cur.words.length >= 3 || (prev && w.start - prev.end >= 0.15)) {
          cur = { words: [], start: w.start, end: w.end };
          GROUPS.push(cur);
        }
        cur.words.push(w);
        cur.end = w.end;
      });

      var captions = document.getElementById("captions");
      GROUPS.forEach(function (g, gi) {
        var el = document.createElement("div");
        el.className = "cg";
        el.id = "cg-" + gi;
        g.words.forEach(function (w) {
          var s = document.createElement("span");
          s.className = "w";
          s.id = "word-" + w.id;
          s.textContent = w.text;
          el.appendChild(s);
        });
        captions.appendChild(el);
      });

      var tl = gsap.timeline({ paused: true });

      tl.fromTo("#title", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.7)" }, 0);
      tl.to("#title", { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 2.3);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.8, duration: 0.15 }, 2.4);
      tl.to("#flash", { opacity: 0, duration: 0.3 }, 2.55);
      tl.fromTo("#insert", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 2.6);
      tl.to("#insert", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, 4.75);

      GROUPS.forEach(function (g, gi) {
        var el = document.getElementById("cg-" + gi);
        var hold = Math.max(g.end, (GROUPS[gi + 1] ? GROUPS[gi + 1].start : g.end + 0.3) - 0.05);
        tl.set(el, { visibility: "visible" }, g.start);
        tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(1.7)" }, g.start);
        g.words.forEach(function (w) {
          tl.set("#word-" + w.id, { className: "w on" }, w.start);
          tl.set("#word-" + w.id, { className: "w" }, w.end);
        });
        tl.to(el, { opacity: 0, duration: 0.1, ease: "power2.in" }, hold - 0.1);
        tl.set(el, { opacity: 0, visibility: "hidden" }, hold);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
